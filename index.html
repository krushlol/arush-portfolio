<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="progress" id="progress"></div>

  <nav class="nav">
    <a href="#top" class="brand" id="brand"></a>
    <div class="nav-links">
      <a href="#about">About</a>
      <a href="#builds">Builds</a>
      <a href="#web">Web</a>
      <a href="#projects">Projects</a>
      <a href="#drums">Drums</a>
      <a href="#contact" class="nav-cta">Contact</a>
    </div>
  </nav>

  <main id="top">
    <!-- Pinned hero: floating cards of real work settle into a grid on scroll -->
    <section class="scene-wrap" id="scene-wrap">
      <div class="hero-bg" aria-hidden="true">
        <i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i>
        <div class="grid-floor"><div class="grid-plane" id="grid-plane"></div></div>
      </div>

      <div class="copy hero-copy" id="hero-copy">
        <p class="eyebrow mono" id="hero-tag"></p>
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-role">I build <span class="role-word" id="role-word"></span><span class="caret"></span></p>
        <p class="intro" id="hero-intro"></p>
        <div class="hero-ctas">
          <a href="#builds" class="btn btn-neon">See my builds</a>
          <a href="#drums" class="btn">Watch me drum</a>
        </div>
        <dl class="hero-stats" id="hero-stats"></dl>
      </div>

      <div class="copy settle-copy" id="settle-copy">
        <p class="eyebrow mono">// the collection</p>
        <h2 class="display" id="settle-title"></h2>
        <p class="intro" id="settle-intro"></p>
      </div>

      <div class="scene"><div class="stage" id="stage"></div></div>

      <div class="scroll-cue" id="scroll-cue"><span></span> Scroll</div>
    </section>

    <section class="section" id="about">
      <header class="section-head" data-reveal>
        <span class="num">00</span>
        <h2 class="display">About</h2>
      </header>
      <div class="about" id="about-body"></div>
    </section>

    <section class="section" id="builds">
      <header class="section-head" data-reveal>
        <span class="num">01</span>
        <h2 class="display">PC Builds</h2>
      </header>
      <div id="build-list"></div>
    </section>

    <section class="section" id="web">
      <header class="section-head" data-reveal>
        <span class="num">02</span>
        <h2 class="display">Web Design</h2>
      </header>
      <div class="web-list" id="web-list"></div>
    </section>

    <section class="section" id="projects">
      <header class="section-head" data-reveal>
        <span class="num">03</span>
        <h2 class="display">Projects</h2>
      </header>
      <div class="project-grid" id="project-grid"></div>
    </section>

    <section class="section" id="drums">
      <header class="section-head" data-reveal>
        <span class="num">04</span>
        <h2 class="display drum-title">Drumming</h2>
      </header>
      <div class="drum-layout" id="drum-layout"></div>
    </section>

    <section class="section contact" id="contact">
      <p class="eyebrow" data-reveal>Get in touch</p>
      <h2 class="display huge" data-reveal>Let's build<br />something.</h2>
      <a class="contact-email" id="contact-email" data-reveal></a>
      <div class="socials" id="socials" data-reveal></div>
    </section>
  </main>

  <footer class="footer"><span id="footer-name"></span> · Built by hand</footer>

  <script src="content.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="main.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</body>
</html>
